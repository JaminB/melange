<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" preserveAspectRatio="xMinYMax slice" aria-hidden="true">
  <!-- Destructible-terrain divider, 1200x64, tiles seamlessly left-to-right (both ends at y=26).
       Same shape as the CSS .mel-divider masks in theme.css. Use as an inline SVG when you need the
       buried rocks; otherwise prefer <div class="mel-divider">. Ground = -mel-divider-fill / -mel-ground,
       grass lip = -mel-grass, outline = currentColor. The grass skips the two blast craters. -->
  <g stroke="currentColor" stroke-linejoin="round" stroke-width="3">
    <path fill="var(--mel-divider-fill, var(--mel-ground, #8A5A33))" d="M0 26C40 23 110 16 168 22C180 24 186 28 192 34C206 50 246 52 262 36C270 28 282 22 300 21C380 18 460 10 560 16S700 28 750 24C760 23 768 26 774 32C790 48 830 48 846 34C854 26 866 21 890 20C980 18 1080 30 1140 27C1160 26.5 1180 27.5 1200 26V66H0Z"/>
    <!-- debris chunks thrown up out of the craters -->
    <path fill="var(--mel-divider-fill, var(--mel-ground, #8A5A33))" stroke-width="2" d="M214 12l7-4 5 5-4 6-7-1zM238 3l6 1v6l-6 1-3-4zM796 9l6-3 4 5-5 5-6-2zM826 15l5-2 3 4-4 3z"/>
    <path fill="none" stroke="var(--mel-grass, #5CB338)" stroke-width="7" stroke-linecap="round" d="M-6 26.5C40 23 110 16 168 22Q178 24 184 27M270 28Q282 22 300 21C380 18 460 10 560 16S700 28 750 24Q760 23 765 25M854 26Q866 21 890 20C980 18 1080 30 1140 27C1160 26.5 1180 27.5 1206 26"/>
    <!-- buried rocks -->
    <g fill="currentColor" stroke="none" opacity=".3">
      <path d="M90 50l12-5 10 4-3 8-16 1z"/><path d="M420 46l9-4 9 3-3 7-13 0z"/>
      <path d="M640 52l13-4 9 5-5 7-14-1z"/><path d="M1010 44l10-4 9 4-4 7-12 0z"/>
      <circle cx="350" cy="56" r="3"/><circle cx="960" cy="58" r="3.5"/><circle cx="1150" cy="50" r="2.5"/>
    </g>
  </g>
</svg>
