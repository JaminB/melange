; Melange configuration. Each [Section] is a module; Enabled=0 turns it off.
; Missing keys are added automatically with their defaults the first time the game runs.
; Logs and dumps are written to the Melange\ folder next to this file.

[Diagnostics]
Enabled=1
HangSeconds=8            ; no frame for this long = hang -> stack trace + minidump
FullMemoryDumps=0        ; 1 = full-memory dumps (hundreds of MB, best for analysis)
SnapshotHotkey=1         ; Ctrl+Shift+F12 = manual stack trace + minidump
SelfTestCrashAtFrame=0   ; testing only
SelfTestHangAtFrame=0    ; testing only

[Logging]
Enabled=1
Dir=                     ; JSONL session folders; empty = Documents\Melange\logs (falls back to Melange\logs next to the game)
Levels=*:info,event:info,engine:info ; minimum level per category (trace, debug, info, warn, error, fatal)
MaxFileMB=32             ; roll over to events.1.jsonl, events.2.jsonl, ... at this size
MaxSessions=20           ; keep the newest N session folders...
MaxTotalMB=512           ; ...and at most this much in total
TailLines=5000           ; records kept in memory for the overlay Log panel
EventDeny=Camera.HasUpdated,Land.CheckVoxel,HeldAccessory.Hide,Acting.Trigger,AI.IssueWormCommand,Input.SomeInputFrom,Particle.DelGraphicalEmitter,sys:0x1004
EventAllow=              ; engine messages to log even if denied (allow wins)
AllowCrashTest=0         ; test only: enables the jlog.crashtest test command

[EventBus]
Enabled=1
DumpRegistry=0           ; 1 = write every engine message name to Melange\messages.tsv

[LogExport]
Enabled=1
Hotkey=Ctrl+Shift+F11    ; "Save logs as..." (also in the overlay's File menu)
Sessions=3               ; newest N JSONL session folders in the zip
IncludeDumps=1           ; newest 3 minidumps
IncludeFullDumps=0       ; full-memory dumps can be hundreds of MB
RedactUserPaths=1        ; replace your Windows user name with %USERNAME%

[Overlay]
Enabled=1
ToggleKey=GRAVE          ; show/hide the overlay (the ` key). Examples: Ctrl+O, Ctrl+Shift+F9, 0x29
PassthroughKey=Shift+GRAVE ; overlay drawn but not interactive: the game keeps mouse and keyboard
Demo=0                   ; 1 = show the Dear ImGui demo window (testing)
VerifyState=0            ; test only: read back GL state around the overlay draw every 60th frame, count mismatches

[SteamTrace]
Enabled=1
VerbosePackets=0         ; 1 = log every P2P packet (large logs)
SummarySeconds=5         ; log per-peer network totals every N seconds

[NetTrace]
Enabled=1

[WindowTag]
Enabled=1

[FrameInterval]
Enabled=0
IntervalMs=16            ; engine frame interval (16 = ~60 fps, 8 = ~120 fps)

[SmoothSixty]
Enabled=1
On=0                     ; 1 = lift the engine frame limiter and pace frames with vsync (also in the overlay menu)

[EngineLog]
Enabled=1
Filter=                  ; only mirror engine lines containing this text (empty = all)
OnlineLog=1              ; also log XomOnline messages (tag + text) that retail sends to a disabled stream

[NetSession]
Enabled=1
Trace=1                  ; log match state machine, turns, surrenders, viability checks, aborts
TraceTransport=1         ; log XSteamConnection create/destroy and unknown-sender packets
FixStaleSurrender=1      ; clear per-player surrender flags left over from the previous match
FixThrottleMask=1        ; restore the NetThrottle received-types mask after host migration
FixViabilityOffset=1     ; reset the session viability offset left at -1 after a host loss
FixStuckPause=1          ; release a network pause left over from the previous match
Watch=1                  ; log every change of throttle / pause / surrender state (pinpoints freezes)
ForceEngineNetLog=1      ; enable the engine's own verbose net logging (same as /LOG ALL)
DeadPeerForfeit=0        ; 1 = a dead peer in a 1v1 forfeits instead of "session no longer available"

[NetTransport]
Enabled=1
FixRetransmit=1          ; retransmit ANY lost packet, not just the first two (fixes the freeze)
ReAckDuplicates=1        ; re-acknowledge duplicate packets so lost ACKs can't stall the peer
LogAcks=0                ; 1 = trace every ACK (very verbose)

[Fixes]
Enabled=1
NetServiceExit=1         ; closing the game after an online or LAN session no longer crashes
AiServiceExit=1          ; closing the game during or after a match no longer crashes

[Mirage]
Enabled=1
ModsDir=Mods             ; mod folders: <game>\Mods\<id>\ (a later folder name wins)
DisabledMods=            ; migrated into Mods\thumper-state.json by Thumper; no longer read after that
StageIds=                ; test only: override the stage slots, e.g. World=pre44,Hud=post163

[MirageTrace]
Enabled=1
Mode=count               ; off | count | log (log costs ~0.6-0.7 ms/frame; count is free)
RingLog2=17              ; log ring size, as a power of two
CaptureHotkey=Ctrl+Shift+F9
CaptureDir=              ; empty = Documents\Melange\captures
TexDumpAtStart=0         ; dump up to this many textures from process start
TexDumpFilter=           ; substring on the XImage name; empty = no filter

[MirageDebug]
Enabled=0                ; 1 = create the game's OpenGL context with the debug flag and log driver messages
Synchronous=1            ; 1 = report the calling module for each message (slower)
MinSeverity=low          ; notification | low | medium | high

[MirageShaders]
Enabled=1
FixFxaa=1                ; make the game's FXAA pass (/FXAA) compile on GPUs without explicit-LOD fetches (AMD, Intel)
TestCompile=1            ; compile edited mod shaders before reloading them; on an error the running shader is kept
GlslReplace=1            ; experimental: shaders\<File>.<Entry>.glsl files replace single programs (read at start)
GlslProfile=0            ; diagnostic only: compile every Cg program to GLSL

[MiragePostFX]
Enabled=1
ToggleKey=Ctrl+Shift+F8    ; bypass / restore the whole post-processing stack
GpuTimers=1              ; measure each effect's GPU time (shown in the Mirage/Post-FX panel)
; Stack and <effect id>.<param> keys below are written by the overlay panel and the postfx.* commands
Stack=

[MirageDraw]
Enabled=1                ; world/HUD primitives and text (melange/draw.h); no options of its own

[Thumper]
Enabled=1                ; mod manager: spice.json manifests, dependency/load-order resolution, Mods page
ModsDir=Mods             ; mod folders: <game>\Mods\<id>\
AutoGrantDeepDesert=0    ; 1 = skip the consent modal; every unsafe mod is trusted on enable
MaxModMessages=48        ; cap on registered engine message names across all content mods (73 free)

[Sandbox]
Enabled=1                ; Lua 5.4 scripting for client mods (docs\lua-api.md)
InstrPerCall=500000      ; Lua instructions per call into a mod; a callback that faults 3 times is disabled
ModMemoryMB=16           ; memory per mod
TotalMemoryMB=96         ; memory for the whole client VM
HotReload=1              ; reload a mod when a .lua file in its entry.client folder changes

[SimBridge]
Enabled=1                ; sim mods (entry.sim) in the match's Lua 5.0 VM; hooks nothing without content mods
InstrPerCall=200000      ; instruction budget of one sim mod call; 3 faults in one callback disable it
LogTicks=0               ; log every simulation tick (debugging)

[SimTweak]
Enabled=1                ; weapon data tweaks from sim mods (wum.sim.weapon)

[Weapons]
Enabled=1                ; weapon clones from content mods (installs nothing unless a mod declares weapons)
ExtraPerExplosion=8      ; extra explosions a mod may add to one clone explosion
LogEvents=0              ; log every clone fire/tick/impact/explosion (debugging)

[Assets]
Enabled=1                ; panel icons, mod loose-file roots and mod banks

[LuaConsole]
Enabled=1
Hotkey=Ctrl+Shift+F10    ; opens the Lua/Console overlay panel
MatchConsoleOnline=0    ; the Match target is refused in an online match unless this is 1 (it changes the sim)
HistorySize=500          ; input lines kept in Documents\Melange\console_history.txt

[Handshake]
Enabled=1
Publish=1                ; write our content identity into lobby member data
SimOnline=1              ; let sim mods run online when every peer's content hash matches
WeaponGate=refuse        ; host with clone weapons: refuse (hold the start while a player's mods differ) | suspend (start with clones off)
LeaveButton=1            ; offer "Leave lobby" when you join a clone lobby your mods do not match

[Wormsign]
Enabled=1                ; tick clock and per-tick state hash
Record=1                 ; keep a rolling recording of every match
RecordDetail=1           ; field-level state per tick in recordings
KeepMatches=20           ; recordings kept (pinned and flagged ones do not count)
MaxMB=200                ; total size cap for recordings
Exchange=1               ; compare hashes with Melange peers that advertise it (never with vanilla peers)
OnDesync=report          ; report | bundle-only; never pauses or ends a match
ReplayAnyContent=0       ; 1 = replay a recording made with different mod content
EnvDigest=changed        ; hash each sim mod's globals and storage: changed (after its code ran) | always | off
ReplayPassLocal=0        ; 1 = let local-only inputs (camera) through while a replay plays
