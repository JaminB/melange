; Melange configuration. Each [Section] is a module; Enabled=0 turns it off.
; Missing keys are added automatically with their defaults the first time the game runs.
; Logs and dumps are written to the Melange\ folder next to this file.

[Diagnostics]
Enabled=1
HangSeconds=8            ; no frame for this long = hang -> stack trace + minidump
FullMemoryDumps=0        ; 1 = full-memory dumps (hundreds of MB, best for analysis)
SnapshotHotkey=1         ; Ctrl+Shift+F12 = manual stack trace + minidump
SelfTestCrashAtFrame=0   ; testing only
SelfTestHangAtFrame=0    ; testing only

[LocalNet]
Enabled=0                ; TESTING ONLY: run Steam lobbies/P2P over localhost so 2+ instances on one PC can play (docs/localnet.md)
Name=                    ; persona name for this instance (empty = Player<slot+1>); give each copy a different name
BasePort=47700           ; instance k binds UDP 127.0.0.1:BasePort+k (k = 0..7)
PeerTimeoutMs=5000       ; silence after which a peer / lobby owner counts as gone
FilterLobbies=1          ; apply the game's lobby search filters like Steam does
MemberLobbyData=0        ; 1 = let non-owners SetLobbyData (Steam only allows the owner)
SelfTest=0               ; 1 = slot 0 hosts / slot 1 joins a hidden test lobby and pings over P2P at startup
LossPercent=0            ; test only: drop this % of game P2P packets to exercise lost-packet recovery
LatencyMs=0              ; test only: delay each game P2P packet by this many ms...
JitterMs=0               ; ...+- a uniform random jitter (packets get reordered, like on the internet)
StallChancePermille=0    ; test only: per-packet chance (1/1000) of a network stall that holds all packets to that peer...
StallMs=1500             ; ...for this long

[Logging]
Enabled=1
Dir=                     ; JSONL session folders; empty = Documents\Melange\logs (falls back to Melange\logs next to the game)
Levels=*:info,event:info,engine:info ; minimum level per category (trace, debug, info, warn, error, fatal)
MaxFileMB=32             ; roll over to events.1.jsonl, events.2.jsonl, ... at this size
MaxSessions=20           ; keep the newest N session folders...
MaxTotalMB=512           ; ...and at most this much in total
TailLines=5000           ; records kept in memory for the overlay Log panel
EventDeny=Camera.HasUpdated,Land.CheckVoxel,HeldAccessory.Hide,Acting.Trigger,AI.IssueWormCommand,Input.SomeInputFrom,Particle.DelGraphicalEmitter,sys:0x1004
EventAllow=              ; engine messages to log even if denied (allow wins)
AllowCrashTest=0         ; test only: enables the jlog.crashtest automation verb

[EventBus]
Enabled=1
DumpRegistry=0           ; 1 = write every engine message name to Melange\messages.tsv

[LogExport]
Enabled=1
Hotkey=Ctrl+Shift+F11    ; "Save logs as..." (also in the overlay's File menu)
Sessions=3               ; newest N JSONL session folders in the zip
IncludeDumps=1           ; newest 3 minidumps
IncludeFullDumps=0       ; full-memory dumps can be hundreds of MB
RedactUserPaths=1        ; replace your Windows user name with %USERNAME%
[Overlay]
Enabled=1
ToggleKey=GRAVE          ; show/hide the overlay (the ` key). Examples: Ctrl+O, Ctrl+Shift+F9, 0x29
PassthroughKey=Shift+GRAVE ; overlay drawn but not interactive: the game keeps mouse and keyboard
Demo=0                   ; 1 = show the Dear ImGui demo window (testing)
VerifyState=0            ; test only: read back GL state around the overlay draw every 60th frame, count mismatches

[SteamTrace]
Enabled=1
VerbosePackets=0         ; 1 = log every P2P packet (large logs)
SummarySeconds=5

[NetTrace]
Enabled=1

[WindowTag]
Enabled=1

[FrameInterval]
Enabled=0
IntervalMs=16

[EngineLog]
Enabled=1
Filter=                  ; only mirror engine lines containing this text (empty = all)
OnlineLog=1              ; also log XomOnline messages (tag + text) that retail sends to a disabled stream

[NetSession]
Enabled=1
Trace=1                  ; log match state machine, turns, surrenders, viability checks, aborts
TraceTransport=1         ; log XSteamConnection create/destroy and unknown-sender packets
FixStaleSurrender=1      ; clear per-player surrender flags left over from the previous match
FixThrottleMask=1        ; restore the NetThrottle received-types mask after host migration
FixViabilityOffset=1     ; reset the session viability offset left at -1 after a host loss
FixStuckPause=1          ; release a network pause left over from the previous match
Watch=1                  ; log every change of throttle / pause / surrender state (pinpoints freezes)
ForceEngineNetLog=1      ; enable the engine's own verbose net logging (same as /LOG ALL)
DeadPeerForfeit=0        ; 1 = a dead peer in a 1v1 forfeits instead of "session no longer available"

[NetTransport]
Enabled=1
FixRetransmit=1          ; retransmit ANY lost packet, not just the first two (fixes the freeze)
ReAckDuplicates=1        ; re-acknowledge duplicate packets so lost ACKs can't stall the peer
LogAcks=0
