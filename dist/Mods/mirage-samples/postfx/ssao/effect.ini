; Screen-space ambient occlusion from the depth buffer alone (the game keeps no normals buffer): 12 taps at half
; resolution with view positions rebuilt through the inverse projection, a depth-aware blur, then applied to the world.
; Radius is in world units at the camera's scale; tune it in game.
[effect]
title=Ambient occlusion (SSAO)
stage=PostWorld
order=100
enabled=0

[param.radius]
type=float
default=1
min=0.05
max=20
label=Radius

[param.intensity]
type=float
default=1
min=0
max=4
label=Intensity

[param.bias]
type=float
default=0.05
min=0
max=0.5
label=Bias

[param.debug]
type=bool
default=0
label=Show the AO term

[pass.ao]
shader=ao.frag
scale=0.5
format=rgba8
inputs=depth

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.5
format=rgba8
inputs=prev,depth

[pass.blurv]
shader=blur.frag
scale=0.5
format=rgba8
inputs=prev,depth

[pass.apply]
shader=apply.frag
inputs=scene,pass.blurv
