; Bloom: bright parts of the world glow. Half-resolution extract and separable blur, then an additive combine.
[effect]
title=Bloom
stage=PostWorld
order=300
enabled=0

[param.threshold]
type=float
default=0.6
min=0
max=1
label=Threshold

[param.intensity]
type=float
default=0.8
min=0
max=3
label=Intensity

[param.radius]
type=float
default=2
min=0.5
max=6
label=Radius

[pass.extract]
shader=extract.frag
scale=0.5
format=rgba16f
inputs=scene

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.5
format=rgba16f
inputs=prev

[pass.blurv]
shader=blur.frag
scale=0.5
format=rgba16f
inputs=prev

[pass.combine]
shader=combine.frag
inputs=scene,pass.blurv
