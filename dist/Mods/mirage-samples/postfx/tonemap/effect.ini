; Tonemap and grade. The game renders to an 8-bit target, so this is a filmic curve on the LDR image, not true HDR.
; lut.png is a 256x16 colour-grading table (16 slices of 16x16, blue picks the slice, top row = green 0). The shipped
; one is neutral: replace it with a graded copy to change the look.
[effect]
title=Tonemap and grade
stage=PostWorld
order=500
enabled=0

[param.exposure]
type=float
default=0
min=-2
max=2
label=Exposure (stops)

[param.strength]
type=float
default=0.7
min=0
max=1
label=Filmic curve

[param.contrast]
type=float
default=1.05
min=0.5
max=1.5
label=Contrast

[param.saturation]
type=float
default=1.1
min=0
max=2
label=Saturation

[param.lut]
type=float
default=1
min=0
max=1
label=LUT amount

[texture.lut]
file=lut.png
filter=linear
wrap=clamp

[pass.grade]
shader=tonemap.frag
inputs=scene,texture.lut
